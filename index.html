<script>

const VERSION='0.1.16';
const HANDS=[{label:'グー',emoji:'✊'},{label:'チョキ',emoji:'✌️'},{label:'パー',emoji:'✋'}];
const RULES=[
 {id:'normal',name:'通常バトル',short:'通常',desc:'すべての数字をそのまま掛け算します。'},
 {id:'evenRampage',name:'偶数の暴走',short:'偶数暴走',desc:'偶数が2枚以上ある攻撃列は攻撃×2。偶数が2枚以上ある防御行は防御半減。'},
 {id:'oddRampage',name:'奇数の暴走',short:'奇数暴走',desc:'奇数が2枚以上ある攻撃列は攻撃×2。奇数が2枚以上ある防御行は防御半減。'},

 {id:'oddGuard',name:'奇数の加護',short:'奇数加護',desc:'奇数が2枚以上ある防御行は防御×2。'},
 {id:'zero',name:'0の覚醒',short:'0覚醒',desc:'すべての掛け算で、数字0を10として扱います。'}
];

const app=document.querySelector('#app');
const state={screen:'home',n:2,ruleMode:'normal',hpMax:100,names:['','','',''],players:[],round:0,rule:null,drawPile:[],setupIds:[],setupIndex:0,choiceIds:[],choiceIndex:0,firstClashPending:false,currentId:0,nextStage:'setup',clash:0,clashCap:3,selection:null,selectedDraw:[],mode:'move',handSelection:null,predictionDraft:{},soundOn:false,revealAnimating:false,revealTimeout:null,result:null,lastStage:'',tutorialStep:0,tutorialBoard:[9,2,3,4,5,6,7,8,1],tutorialSelection:null,tutorialTactic:null,handDecision:null};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function stat(board,rule){const b=board.map(v=>(rule?.id==='zero' && v===0)?10:v); const atk=[0,1,2].map(c=>b[c]*b[c+3]*b[c+6]); const def=[0,1,2].map(r=>b[r*3]*b[r*3+1]*b[r*3+2]);

const player=id=>state.players.find(p=>p.id===id);
// 全員が生存する手を1種類ずつ持ち、手の種類がちょうど2種類なら、
// じゃんけんの優劣で負ける種類を確定できる。魔法陣の強さはこの決着判定に使わない。
function remainingHandDecision(players=alivePlayers()){
 if(players.length<2||players.some(p=>p.hp.filter(v=>v>0).length!==1))return null;
 const hands=players.map(p=>({id:p.id,name:p.name,hand:p.hp.findIndex(v=>v>0),hp:p.hp.find(v=>v>0)}));
 const kinds=[...new Set(hands.map(p=>p.hand))];
 // 全員同じ手ならあいこ。3種類なら優劣が循環するため続行。
 if(kinds.length!==2)return null;
 const winningHand=(kinds[0]+1)%3===kinds[1]?kinds[0]:kinds[1];
 return {winningHand,losingHand:kinds.find(h=>h!==winningHand),winners:hands.filter(p=>p.hand===winningHand),losers:hands.filter(p=>p.hand!==winningHand)};
}
function resolveRemainingHands(){
 const decision=remainingHandDecision();
 if(!decision)return false;
 state.handDecision=decision;
 for(const loser of decision.losers){const p=player(loser.id);p.hp=[0,0,0];}
 clearTimeout(state.revealTimeout);state.revealAnimating=false;
 state.screen='hand-decision';render();window.scrollTo(0,0);
 return true;
}

function expectedTripleProduct(cards){
 if(cards.length<3)return 0;
 let sum=0,count=0;
 for(let i=0;i<cards.length-2;i++)for(let j=i+1;j<cards.length-1;j++)for(let k=j+1;k<cards.length;k++){
  sum+=cards[i]*cards[j]*cards[k];count++;
 }
 return sum/count;
}
// Scale estimated from random nine-card deals from the shared 0-9 x4 deck.
// These anchors represent approximate percentile ranks rather than a theoretical maximum.
const STRENGTH_PERCENTILES={
 normal:[[0,0],[22,5],[31,10],[44,20],[58,33],[78,50],[103,67],[129,80],[162,90],[192,95],[256,99],[450,100]],
 zero:[[0,0],[60,5],[74,10],[96,20],[120,33],[152,50],[188,67],[228,80],[275,90],[316,95],[401,99],[650,100]]
};
function strengthPercentile(value,zeroAwakening){
 const points=zeroAwakening?STRENGTH_PERCENTILES.zero:STRENGTH_PERCENTILES.normal;
 for(let i=1;i<points.length;i++){
  if(value<=points[i][0]){
   const [x0,y0]=points[i-1],[x1,y1]=points[i];
   return Math.max(0,Math.min(100,Math.round(y0+(y1-y0)*(value-x0)/(x1-x0))));
  }
 }
 return 100;
}
function cardStrengthHtml(board,rule){
 const zeroAwakening=rule?.id==='zero';
 const factorCards=board.map(n=>zeroAwakening&&n===0?10:n);
 const triple=Math.round(expectedTripleProduct(factorCards));
 const percentile=strengthPercentile(triple,zeroAwakening);
 const tier=percentile<15?0:percentile<35?1:percentile<65?2:percentile<85?3:4;
 const names=['とても弱い','やや弱い','ふつう','やや強い','とても強い'];
 const label=names[tier];
 return `<div class="deck-strength-meter strength-tier-${tier}" role="group" aria-label="9枚の数字の強さ ${triple}、評価 ${label}"><div class="deck-strength-meter-row"><span class="deck-strength-compact-title">📊 9枚の数字の強さ</span><strong class="deck-strength-compact-number">${triple}</strong><span class="deck-strength-rating">${label}</span></div><div class="deck-strength-track" role="img" aria-label="相対的な強さ ${percentile}パーセント"><div class="deck-strength-fill" style="width:${percentile}%"></div></div><div class="deck-strength-scale" aria-hidden="true"><span>弱い</span><span>標準</span><span>強い</span></div></div>`;
}

function choose(){let p=player(state.currentId),s=stat(p.board,state.rule);return `${pStatus()}<div class="panel"><h2>${esc(p.name)}さん、第${state.clash}戦の手を選んでください</h2><div class="callout">残っている手から1つ選びます。同じラウンドで同じ手は2回使えません。<strong>相手の手を予想するのは自由</strong>です。選ばなくても何も変わりません。決定すると画面を隠します。</div>${opponentsHands(p.id)}<div class="rpschoice">${HANDS.map((h,i)=>{let dead=p.hp[i]<=0,used=p.used.includes(i),sel=state.handSelection===i;return `<button class="handbtn ${sel?'selected':''} ${p.hp[i]/state.hpMax<=.3?'low':''}" data-pick="${i}" ${dead||used?'disabled':''}><span class="emoji">${h.emoji}</span><strong>${h.label}</strong><span class="nums">攻 ${s.atk[i]} / 防 ${s.def[i]}</span>${miniHp(p,i)}<span class="statusline">${dead?'HP0・使用不可':used?'このラウンド使用済み':sel?'選択中':'選択できます'}</span></button>`}).join('')}</div><div style="margin-top:18px"><button class="btn gold large wide" data-action="choose-done" ${state.handSelection===null?'disabled':''}>この手で決定して画面を隠す 🔒</button>${state.firstClashPending?`<button class="btn soft wide" style="margin-top:10px" data-action="back-to-setup">← 魔法陣の配置に戻る</button>`:''}</div><details style="margin-top:17px"><summary style="cursor:pointer;color:#b5cafa">自分の魔法陣を確認</summary><div style="max-width:560px;margin:12px auto">${boardHtml(p.board)}</div></details></div>`;}
function autoJankenScreen(){return `${pStatus()}<section class="auto-choice-stage"><div class="symbol">🤖</div><h1>残った手が1つしかないため、<br>自動で選択します</h1><p class="note">次の画面で「じゃんけん・・・」と「ポン！」が表示されます。みんなが画面を見られる状態にして進んでください。</p><button class="btn gold large wide" data-action="auto-janken-next">じゃんけんの画面へ進む</button></section>`;}
function jankenScreen(){return `${pStatus()}<section class="janken-stage" aria-label="全員の選択完了・じゃんけん開始"><div class="janken-round">全員の手が決まりました · 第${state.clash}戦</div><p class="janken-note">みんなが画面を見られる状態になったら、<br>大きなボタンを押して一斉公開しましょう！</p><h1 class="janken-heading">じゃんけん・・・</h1><button class="pon-button" type="button" data-action="pon" autofocus>ポン！</button><button class="sound-switch" type="button" data-action="sound-toggle" aria-pressed="${state.soundOn}">${state.soundOn?'🔊 効果音：オン':'🔇 効果音：オフ'}</button><p class="note" style="margin-top:18px">※「ポン！」を押すまでは、誰の手も表示しません。</p></section>`;}
function showJanken(){if(!state.choiceIds.length||!state.choiceIds.every(id=>player(id)?.choice!==null&&player(id)?.choice!==undefined))return;state.handSelection=null;state.screen='janken';render();}
function computeBattle(){let a=state.choiceIds.map(id=>player(id)).filter(Boolean);let entries=a.map(p=>({id:p.id,name:p.name,hand:p.choice,attack:stat(p.board,state.rule).atk[p.choice],defense:stat(p.board,state.rule).def[p.choice],before:p.hp[p.choice],predictions:{...(p.predictions||{})}}));let out=[];for(let d of entries){let attacks=[];for(let s of entries){if(s.id===d.id)continue;let tie=s.hand===d.hand;let wins=(s.hand===0&&d.hand===1)||(s.hand===1&&d.hand===2)||(s.hand===2&&d.hand===0);if(tie||wins){let dmg=Math.max(0,s.attack-d.defense);attacks.push({from:s.name,sourceId:s.id,attack:s.attack,damage:dmg,hand:s.hand});}}let best=attacks.sort((a,b)=>b.damage-a.damage)[0]||null;let damage=best?best.damage:0;out.push({...d,attacks,damage,source:best?best.from:null,remaining:Math.max(0,d.before-damage)});}
 for(let x of out){let p=player(x.id);p.hp[x.hand]=x.remaining;p.used.push(x.hand);p.choice=null;p.totalDamage=(p.totalDamage||0)+x.damage;}
 state.result=out;state.screen='result';state.revealAnimating=!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);render();window.scrollTo(0,0);if(state.revealAnimating){clearTimeout(state.revealTimeout);state.revealTimeout=setTimeout(finishReveal,2850);}}
function playPonSound(){if(!state.soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();const start=c.currentTime;[0,.105,.205].forEach((dt,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=i===2?'triangle':'sine';o.frequency.setValueAtTime([370,470,660][i],start+dt);o.frequency.exponentialRampToValueAtTime([300,420,520][i],start+dt+.13);g.gain.setValueAtTime(.001,start+dt);g.gain.exponentialRampToValueAtTime(.09,start+dt+.014);g.gain.exponentialRampToValueAtTime(.001,start+dt+.145);o.connect(g).connect(c.destination);o.start(start+dt);o.stop(start+dt+.15);});setTimeout(()=>c.close().catch(()=>{}),1200);}catch(_e){/* muted when audio API is unavailable */}}
function finishReveal(){clearTimeout(state.revealTimeout);state.revealTimeout=null;if(state.screen!=='result')return;state.revealAnimating=false;const panel=app.querySelector('.result-panel');if(panel)panel.classList.remove('reveal-cinematic');const next=app.querySelector('.result-next-button');if(next)next.disabled=false;const skip=app.querySelector('[data-action="skip-reveal"]');if(skip)skip.remove();const impact=app.querySelector('.reveal-impact');if(impact)impact.remove();}
function outcomeFor(r,all){let wins=0,losses=0,ties=0;for(let other of all){if(other.id===r.id)continue;if(other.hand===r.hand)ties++;else if((r.hand+1)%3===other.hand)wins++;else losses++;}if(wins&&losses)return {label:'勝ち・負け',kind:'mixed',description:'勝ち負け両方の相手がいます'};if(wins)return {label:ties?'勝ち・あいこ':'勝ち！',kind:'win',description:ties?'勝利とあいこがあります':'じゃんけん勝利！'};if(losses)return {label:ties?'負け・あいこ':'負け',kind:'lose',description:ties?'敗北とあいこがあります':'じゃんけん敗北'};return {label:'あいこ！',kind:'draw',description:'同じ手で引き分け'};}
function resultScreen(){let remaining=alivePlayers().length;
 let outcomeLabels=state.result.map(r=>outcomeFor(r,state.result));
 let headline=state.result.length===2?(state.result[0].hand===state.result[1].hand?'あいこ！':`${esc(state.result[outcomeLabels.findIndex(o=>o.kind==='win')].name)}さんの勝ち！`):'全員の手を公開！';
 let revelation=state.result.map((r,i)=>{
   let o=outcomeLabels[i];
   const predictionRows=Object.entries(r.predictions||{}).map(([otherId,guess])=>{const other=state.result.find(x=>x.id===Number(otherId));if(!other||guess===null||guess===undefined)return '';const correct=guess===other.hand;return `<div class="prediction-result ${correct?'correct':''}" aria-label="${correct?'予想的中':'予想はずれ'}"><span class="icon">${correct?'🎯':'🔮'}</span><span>${esc(other.name)}さん ${HANDS[guess].emoji} を予想</span><strong>${correct?'予想的中！':'予想はずれ'}</strong></div>`;}).join('');
   // The chosen hand's attack/defense are visible after the reveal, but not the 3x3 board.
   let hitBreakdown=r.attacks.length? r.attacks.map(a=>`<div class="reveal-calc-line ${r.attacks.length>1&&a.damage===r.damage?'top-hit':''}"><span>${esc(a.from)}さんの攻撃 ${a.attack} − 防御 ${r.defense}</span><strong>${a.attack<r.defense?'→':'＝'} ${a.damage}${a.attack<r.defense?'（防御成功）':''}</strong></div>`).join('') : '<div class="reveal-calc-line">この手への攻撃なし</div>';
   let maxTag=r.attacks.length>1?'<div class="reveal-calc-caption">※最大の1撃だけを適用</div>':'';
   return `<div class="reveal-player ${o.kind}" style="--card-index:${i}"><div class="reveal-player-name">${esc(r.name)}さん</div><div class="reveal-hand" aria-label="${HANDS[r.hand].label}">${HANDS[r.hand].emoji}</div><div class="reveal-hand-label">${HANDS[r.hand].label}</div><div class="reveal-outcome">${o.label}</div><div class="reveal-combat-stats"><span>攻撃 <strong>${r.attack}</strong></span><span>防御 <strong>${r.defense}</strong></span></div><div class="reveal-calc"><div class="reveal-calc-title">ダメージ計算</div>${hitBreakdown}${maxTag}</div><div class="reveal-damage">被ダメージ <strong>${r.damage}</strong></div><div class="reveal-hp">HP ${r.before} → <strong>${r.remaining}</strong>${r.remaining===0?' 💀':''}</div>${predictionRows?`<div class="prediction-results">${predictionRows}</div>`:''}</div>`;
 }).join('');
 let battleDetails=state.result.map(r=>`<div class="logitem"><strong>${esc(r.name)}さん（${HANDS[r.hand].emoji}）</strong><div class="note">防御力 ${r.defense} / HP ${r.before} → ${r.remaining}</div>${r.attacks.length?r.attacks.map(a=>`<div class="attack-math">${esc(a.from)}さんの攻撃 ${a.attack} − ${esc(r.name)}さんの防御 ${r.defense} → <strong>${a.damage} ダメージ</strong></div>`).join(''):'<div class="attack-math">この勝負では攻撃を受けません</div>'}<div class="attack-final">採用ダメージ：<strong>${r.damage}</strong>（最大の1撃のみ）</div></div>`).join('');
 const anim=state.revealAnimating;return `<section class="panel result-panel ${anim?'reveal-cinematic':''}"><div class="reveal-impact" aria-hidden="true">ポン！</div><div class="reveal-hero"><div class="reveal-kicker">第${state.round}ラウンド · 第${state.clash}戦</div><h1 class="reveal-heading">じゃんけんの結果！</h1><div class="reveal-headline">${headline}</div></div><div class="reveal-grid count-${state.result.length}">${revelation}</div>${hasNextClash()?'':`<details class="result-details"><summary>魔法陣・攻撃の内訳を見る <span class="detail-chevron" aria-hidden="true">⌄</span></summary><div class="detail-content"><h3>全員の魔法陣</h3><div class="grid2">${state.players.map(p=>`<div><h3>${esc(p.name)}さんの配置</h3>${boardHtml(p.board)}</div>`).join('')}</div><h3 style="margin-top:23px">攻撃の計算内訳</h3><div class="battle-log">${battleDetails}</div></div></details>`}<h3 style="margin-top:24px">現在のHP</h3><div class="result-hp-grid">${state.players.map(p=>`<div class="player-card result-hp-card ${p.hp.every(h=>h<=0)?'dead':''}"><div class="playername">${esc(p.name)} ${p.hp.every(h=>h<=0)?'（脱落）':''}</div>${hpBarsResult(p)}</div>`).join('')}</div>${remaining<=1?`<div class="callout" style="margin-top:18px">${remaining===0?'全員の手が同時に尽きました。引き分けです。':`${esc(alivePlayers()[0].name)}さんが最後まで生き残りました！`}</div>`:''}<div class="reveal-utilities">${anim?'<button type="button" class="reveal-skip-button" data-action="skip-reveal">⏩ 演出をスキップ</button>':''}</div><button class="btn gold large wide result-next-button" style="margin-top:6px" data-action="result-next" ${anim?'disabled':''}>${remaining<=1?'最終結果を見る':remainingHandDecision()?'残りの手で決着判定へ':hasNextClash()?'次のじゃんけんへ':'次のラウンドへ（再配布）'}</button></section>`;}

function hasNextClash(){return state.clash<state.clashCap && alivePlayers().every(p=>unused(p).length>0);}

 <p><strong>あなたなら、どちらを出しますか？</strong> 選んで結果の可能性を比べてみましょう。</p>
 <div class="tactic-buttons"><button type="button" class="tactic-choice ${state.tutorialTactic==='paper'?'active':''}" data-tactic="paper"><span class="icon">✋</span>パーを出す</button><button type="button" class="tactic-choice ${state.tutorialTactic==='scissors'?'active':''}" data-tactic="scissors"><span class="icon">✌️</span>チョキを出す</button></div>
 ${state.tutorialTactic==='paper'?`<div class="tactic-feedback" aria-live="polite"><div class="verdict">✋ パーを選んだ場合</div>相手が<strong>✊ グー</strong>なら勝ち。相手が<strong>✋ パー</strong>ならあいこで双方攻撃です。<br><b>グーを読むなら有力ですが、あいこになったときの防御力も考えましょう。</b></div>`:state.tutorialTactic==='scissors'?`<div class="tactic-feedback" aria-live="polite"><div class="verdict">✌️ チョキを選んだ場合</div>相手が<strong>✋ パー</strong>なら勝ち。相手が<strong>✊ グー</strong>なら負けです。<br><b>パーを読むなら有力ですが、負けた場合の防御力も考えましょう。</b></div>`:`<div class="tactic-feedback">どちらにも勝てる相手と、危険な相手がいます。<strong>相手が何を出しそうか</strong>を想像して選ぶのが戦略です。</div>`}
 <div class="tutorial-highlight">実戦では、<strong>相手ごとに出す手を予想する</strong>こともできます。予想は<strong>任意</strong>。「ポン！」で当たれば<strong>🎯 予想的中！</strong>と表示されますが、<strong>ダメージ・HP・勝敗には一切影響しません。</strong>予想しなくても不利になりません。</div><p>さらに、<strong>相手の残りHPや、自分が次に残したい手</strong>も考慮すると、読み合いはもっと深くなります。</p>`;
 if(step===6)body=`
 <p>普通のじゃんけんでは「負け」は失敗。でもこのゲームでは、<strong>わざと負ける選択が有利になる</strong>こともあります。</p>
 <div class="tactic-example"><div class="tactic-fighter"><div class="note">自分</div><div class="emoji">✊</div><strong>グー</strong><div class="stats">防御 160</div></div><div class="tactic-vs">負け</div><div class="tactic-fighter"><div class="note">相手</div><div class="emoji">✋</div><strong>パー</strong><div class="stats">攻撃 120</div></div></div>
 <div class="tutorial-keyphrase">120 − 160 → ダメージ 0！</div>
 <div class="tutorial-highlight">じゃんけんは負けでも、<strong>防御力が上回ればHPは減りません。</strong> 攻撃力の高い別の手を後の勝負に残すために、防御力の高い手であえて負ける――それも立派な作戦です。</div>
 <p class="note">これは考え方を示す例です。実際には相手の選んだ手や攻撃力は事前に分からず、予想が外れることもあります。また、使った手はそのラウンドでは再使用できません。</p>
 <p><strong>目先のじゃんけんの勝ち負けだけではなく、残りHPと次の勝負まで考えること</strong>が勝利につながります。</p>`;
 if(step===7)body=`
 <p>ゲーム開始前に<strong>「通常ルールのみ」</strong>と<strong>「特殊ルールあり」</strong>を選べます。特殊ルールありの場合は、ラウンドごとに6種類からルールが選ばれ、数字の配置で有利不利が変わります。</p>
 <details style="margin:12px 0"><summary style="cursor:pointer;padding:12px;background:#1a3150;border-radius:10px;font-weight:800">6種類のルールを見る</summary><div class="grid2" style="margin-top:12px">${RULES.map(r=>`<div class="player-card"><strong>${r.name}</strong><div class="note">${r.desc}</div></div>`).join('')}</div></details>
 <p>また、数字カードは<strong>2〜3人戦で2枚まで、4人戦で1枚まで</strong>引き直せます。狙う攻撃や防御に合わせて交換することも戦略です。</p>`;
 if(step===8)body=`
 <p>同じPCで遊ぶため、<strong>カード・魔法陣・選んだ手をほかの人に見せない</strong>ことが大切です。最初の勝負では数字の配置と手の選択を続けて行い、その後で次の人へPCを渡します。</p>
 <div class="rule-art" style="border-radius:15px;max-width:540px;margin:auto">${svgPass()}</div>
 <div class="tutorial-highlight">数字を配置 → 第1戦の手を選択 → PCを渡す → 全員の手が決まったら<strong>「じゃんけん・・・ポン！」</strong>で一斉公開！</div>
 <p>受け渡し時は本人が受け取ったことを確認し、周囲に誰もいないか確かめてから秘密の画面を開きます。<strong>ラウンド中のすべての勝負が終わるまで、他人の魔法陣は見られません。</strong></p>
 <p class="tutorial-keyphrase">さあ、数字の配置と相手の心理を読み合おう！</p>`;
 return `<section class="panel"><div class="flex" style="justify-content:space-between"><div><div class="eyebrow">TUTORIAL</div><h2 style="margin:7px 0">チュートリアル</h2></div><button class="btn soft" data-action="home">トップへ戻る</button></div><div class="stepper">${titles.map((t,i)=>`<div class="step ${i===step?'current':i<step?'done':''}"><i>${i+1}</i>${i===step?esc(t):''}</div>`).join('')}</div><div class="tutorial-box"><h3>${step+1}. ${titles[step]}</h3>${body}</div><div class="flex" style="justify-content:space-between;margin-top:20px"><button class="btn" data-action="tutorial-prev" ${step===0?'disabled':''}>← 前へ</button><button class="btn gold" data-action="tutorial-next">${step===titles.length-1?'チュートリアル完了・トップへ':'次へ →'}</button></div></section>`;
}
function startMatch(){clearTimeout(state.revealTimeout);state.revealAnimating=false;state.predictionDraft={};state.handDecision=null;let raw=Array.from(document.querySelectorAll('[data-player-name]'));raw.forEach(x=>state.names[Number(x.dataset.playerName)]=x.value.trim());state.players=Array.from({length:state.n},(_,i)=>({id:i,name:state.names[i]||`プレイヤー${i+1}`,hp:[state.hpMax,state.hpMax,state.hpMax],board:[],used:[],redrawUsed:0,choice:null,totalDamage:0}));state.round=0;startRound(true);}
function startRound(first=false){if(!first&&resolveRemainingHands())return;state.round++;state.rule=state.ruleMode==='normal'?RULES[0]:RULES[Math.floor(R()*RULES.length)];state.drawPile=makeDeck();let live=alivePlayers();for(let p of live){p.board=state.drawPile.splice(0,9);p.used=[];p.redrawUsed=0;p.choice=null;p.predictions={};}state.setupIds=live.map(p=>p.id);state.setupIndex=0;state.firstClashPending=true;state.clash=0;state.clashCap=Math.min(...live.map(p=>p.hp.filter(h=>h>0).length));state.result=null;readyTo(state.setupIds[0],'setup');}
function setupDone(){if(state.screen!=='setup')return;state.clash=1;state.choiceIds=state.setupIds.slice();state.choiceIndex=state.setupIndex;state.handSelection=null;state.selection=null;state.selectedDraw=[];
 if(allHaveOneHand()){const p=player(state.currentId);p.choice=unused(p)[0];if(state.setupIndex<state.setupIds.length-1){state.setupIndex++;handoffTo(state.setupIds[state.setupIndex],'setup');}else{state.firstClashPending=false;state.screen='auto-janken';render();}return;}
 state.screen='choose';render();}
function beginClash(){let active=alivePlayers();if(active.length<=1){state.screen='gameover';render();return;}state.choiceIds=active.filter(p=>unused(p).length>0).map(p=>p.id);if(state.choiceIds.length!==active.length){startRound();return;}state.choiceIndex=0;for(const p of active)p.predictions={};
 if(allHaveOneHand(active)){for(const p of active)p.choice=unused(p)[0];state.screen='auto-janken';render();return;}
 handoffTo(state.choiceIds[0],'choose');}
function choiceDone(){if(state.screen!=='choose')return;let p=player(state.currentId);if(state.handSelection===null||p.hp[state.handSelection]===0||p.used.includes(state.handSelection))return;p.choice=state.handSelection;p.predictions={};for(const other of alivePlayers()){if(other.id===p.id)continue;const guess=state.predictionDraft[other.id];if(Number.isInteger(guess)&&unused(other).includes(guess))p.predictions[other.id]=guess;}state.handSelection=null;state.predictionDraft={};if(state.firstClashPending){if(state.setupIndex<state.setupIds.length-1){state.setupIndex++;handoffTo(state.setupIds[state.setupIndex],'setup');}else{state.firstClashPending=false;showJanken();}}else if(state.choiceIndex<state.choiceIds.length-1){state.choiceIndex++;handoffTo(state.choiceIds[state.choiceIndex],'choose');}else showJanken();}
function afterResult(){if(alivePlayers().length<=1){state.screen='gameover';render();return;}if(resolveRemainingHands())return;if(hasNextClash()){state.clash++;beginClash();}else startRound();}
function afterHandDecision(){
 if(state.screen!=='hand-decision')return;
 if(alivePlayers().length<=1){state.screen='gameover';render();return;}
 state.handDecision=null;
 if(hasNextClash()){state.clash++;beginClash();}else startRound();
}
function changeCell(i){let b=state.screen==='setup'?player(state.currentId).board:state.tutorialBoard;if(state.screen==='tutorial'){if(state.tutorialSelection===null){state.tutorialSelection=i;}else{[b[i],b[state.tutorialSelection]]=[b[state.tutorialSelection],b[i]];state.tutorialSelection=null;}render();return;}
 let p=player(state.currentId);if(state.mode==='draw'){let idx=state.selectedDraw.indexOf(i),limit=(alivePlayers().length===4?1:2)-p.redrawUsed;if(idx>=0)state.selectedDraw.splice(idx,1);else if(state.selectedDraw.length<limit)state.selectedDraw.push(i);}else{if(state.selection===null)state.selection=i;else{[b[i],b[state.selection]]=[b[state.selection],b[i]];state.selection=null;}}render();}
function redrawCards(){let p=player(state.currentId),limit=alivePlayers().length===4?1:2;if(p.redrawUsed+state.selectedDraw.length>limit||state.selectedDraw.length>state.drawPile.length)return;for(let i of state.selectedDraw){p.board[i]=state.drawPile.shift();p.redrawUsed++;}state.selectedDraw=[];if(p.redrawUsed===limit)state.mode='move';render();}
app.addEventListener('input',ev=>{if(ev.target.matches('[data-player-name]'))state.names[Number(ev.target.dataset.playerName)]=ev.target.value;});
app.addEventListener('click',ev=>{const hit=ev.target.closest('button');if(!hit||hit.disabled)return;
 if(hit.dataset.hp){state.hpMax=Number(hit.dataset.hp);render();return;}
 if(hit.dataset.count){state.n=Number(hit.dataset.count);render();return;}
 if(hit.dataset.ruleMode){state.ruleMode=hit.dataset.ruleMode;render();return;}
 if(hit.dataset.slot!==undefined){if(state.screen==='setup'||state.screen==='tutorial'&&state.tutorialStep===1)changeCell(Number(hit.dataset.slot));return;}
 if(hit.dataset.tactic&&state.screen==='tutorial'&&state.tutorialStep===5){state.tutorialTactic=hit.dataset.tactic;render();return;}
 if(hit.dataset.predictPlayer!==undefined&&state.screen==='choose'){const opponent=player(Number(hit.dataset.predictPlayer));const p=player(state.currentId);if(opponent&&p&&opponent.id!==p.id&&alivePlayers().some(x=>x.id===opponent.id)){const h=hit.dataset.predictHand;if(h==='none'){delete state.predictionDraft[opponent.id];}else{const choice=Number(h);if(unused(opponent).includes(choice)){if(state.predictionDraft[opponent.id]===choice)delete state.predictionDraft[opponent.id];else state.predictionDraft[opponent.id]=choice;}}render();}return;}
 if(hit.dataset.pick!==undefined){state.handSelection=Number(hit.dataset.pick);render();return;}
 let action=hit.dataset.action;if(!action)return;
 if(action==='start')startMatch();
 else if(action==='home'){state.screen='home';render();}
 else if(action==='tutorial'){state.tutorialStep=0;state.tutorialBoard=[9,2,3,4,5,6,7,8,1];state.tutorialSelection=null;state.tutorialTactic=null;state.screen='tutorial';render();}
 else if(action==='tutorial-prev'){state.tutorialStep=Math.max(0,state.tutorialStep-1);render();}
 else if(action==='tutorial-next'){if(state.tutorialStep>=TUTORIAL_TITLES.length-1)state.screen='home';else state.tutorialStep++;render();}
 else if(action==='handoff-done'){state.screen='ready';render();}
 else if(action==='ready-done'){state.screen=state.nextStage;render();}
 else if(action==='mode-move'){state.mode='move';state.selection=null;state.selectedDraw=[];render();}
 else if(action==='mode-draw'){state.mode='draw';state.selection=null;state.selectedDraw=[];render();}
 else if(action==='redraw')redrawCards();
 else if(action==='setup-done')setupDone();
 else if(action==='back-to-setup'&&state.screen==='choose'&&state.firstClashPending){state.handSelection=null;state.screen='setup';render();}
 else if(action==='choose-done')choiceDone();
 else if(action==='auto-janken-next'&&state.screen==='auto-janken')showJanken();
 else if(action==='sound-toggle'&&state.screen==='janken'){state.soundOn=!state.soundOn;render();}
 else if(action==='pon'&&state.screen==='janken'){playPonSound();computeBattle();}
 else if(action==='skip-reveal'&&state.screen==='result')finishReveal();
 else if(action==='result-next')afterResult();
 else if(action==='hand-decision-next')afterHandDecision();
});
render();
</script>
</body>
</html>
