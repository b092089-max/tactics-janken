function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeDeck(){return shuffle(Array.from({length:40},(_,i)=>Math.floor(i/4)));}
function stat(board,rule){const b=board.map(v=>(rule?.id==='zero' && v===0)?10:v); const atk=[0,1,2].map(c=>b[c]*b[c+3]*b[c+6]); const def=[0,1,2].map(r=>b[r*3]*b[r*3+1]*b[r*3+2]);
 const typ=rule?.id.startsWith('even')?'even':rule?.id.startsWith('odd')?'odd':null;
 const qualifies=arr=>arr.filter(v=>typ==='even'?v%2===0:v%2!==0).length>=2;
 if(typ){for(let i=0;i<3;i++){const col=[board[i],board[i+3],board[i+6]],row=board.slice(i*3,i*3+3);if(rule.id.endsWith('Rampage')){if(qualifies(col))atk[i]*=2;if(qualifies(row))def[i]=Math.floor(def[i]/2);}else if(qualifies(row))def[i]*=2;}}
 return {atk,def};}
const alivePlayers=()=>state.players.filter(p=>p.hp.some(h=>h>0));
const unused=(p)=>[0,1,2].filter(i=>p.hp[i]>0&&!p.used.includes(i));
const player=id=>state.players.find(p=>p.id===id);
function header(){return `<div class="topline"><div class="brand"><div class="brandmark">✦</div><span>タクティクスじゃんけん</span></div><span class="version">v${VERSION}</span></div>`;}
function render(){let body='';if(state.screen==='home')body=home();if(state.screen==='tutorial')body=tutorial();if(state.screen==='handoff')body=handoff();if(state.screen==='ready')body=ready();if(state.screen==='setup')body=setup();if(state.screen==='choose')body=choose();if(state.screen==='janken')body=jankenScreen();if(state.screen==='result')body=resultScreen();if(state.screen==='gameover')body=gameover();app.innerHTML=(state.screen==='home'||state.screen==='tutorial'?header():'')+body+(state.screen==='home'||state.screen==='tutorial'?`<footer class="footer">タクティクスじゃんけん v${VERSION} · この端末だけで遊べます · 対戦中の情報はブラウザ内で管理</footer>`:'');}
function svgBoard(){return `<svg viewBox="0 0 300 150" role="img" aria-label="3行3列の数字と、攻撃が縦、防御が横で決まる説明図"><defs><linearGradient id="br" x1="0" x2="1"><stop stop-color="#2e5585"/><stop offset="1" stop-color="#684b90"/></linearGradient></defs><g transform="translate(75 20)">${[8,2,5,4,9,1,7,3,6].map((x,i)=>`<rect x="${(i%3)*57}" y="${Math.floor(i/3)*35}" width="49" height="29" rx="7" fill="url(#br)" stroke="#9db5e7"/><text x="${(i%3)*57+24}" y="${Math.floor(i/3)*35+21}" text-anchor="middle" fill="white" font-weight="bold" font-size="20">${x}</text>`).join('')}</g><text x="100" y="13" fill="#ffcf99" font-size="12">攻撃（縦）↓</text><text x="3" y="76" fill="#aadaff" font-size="12">防御 →</text><text x="125" y="146" fill="#b9d5f6" font-size="12">数字の配置で強さが変わる</text></svg>`;}
function svgRps(){return `<svg viewBox="0 0 300 150" role="img" aria-label="グー、チョキ、パーで勝敗を決めてHPを減らす説明図"><circle cx="60" cy="65" r="40" fill="#365d94" stroke="#8db9fa"/><circle cx="150" cy="65" r="40" fill="#77508e" stroke="#caa3fa"/><circle cx="240" cy="65" r="40" fill="#805345" stroke="#ffb39c"/><text x="60" y="77" text-anchor="middle" font-size="41">✊</text><text x="150" y="77" text-anchor="middle" font-size="41">✌️</text><text x="240" y="77" text-anchor="middle" font-size="41">✋</text><path d="M 88 35 Q 150 -4 212 35" stroke="#ffdf84" stroke-width="3" fill="none" stroke-dasharray="5 5"/><text x="150" y="17" fill="#ffdf84" text-anchor="middle" font-size="13">読み合い！</text><text x="150" y="135" fill="#c6def9" text-anchor="middle" font-size="13">手ごとにHPがある</text></svg>`;}
function svgPass(){return `<svg viewBox="0 0 300 150" role="img" aria-label="自分の手札を隠して次のプレイヤーにPCを渡す説明図"><rect x="95" y="18" width="110" height="70" rx="9" fill="#1a314e" stroke="#9ecbff" stroke-width="4"/><path d="M 115 70 L 155 40 L 187 70" stroke="#f2cb7a" stroke-width="5" fill="none"/><circle cx="155" cy="37" r="9" fill="#f2cb7a"/><rect x="146" y="88" width="8" height="16" fill="#719bda"/><rect x="123" y="104" width="54" height="7" rx="3" fill="#719bda"/><circle cx="45" cy="54" r="17" fill="#7caff5"/><path d="M 17 105 Q 45 55 73 105" fill="#4371ac"/><circle cx="255" cy="54" r="17" fill="#dba4b8"/><path d="M 227 105 Q 255 55 283 105" fill="#895579"/><path d="M 78 127 H 220" stroke="#eacb82" stroke-width="3"/><path d="M 209 119 L 221 127 L 209 135" stroke="#eacb82" stroke-width="3" fill="none"/></svg>`;}
function home(){let hpOpts=[100,200,300,400].map(v=>`<button class="pill ${state.hpMax===v?'active':''}" data-hp="${v}">${v} HP</button>`).join(''); let nOpts=[2,3,4].map(v=>`<button class="pill ${state.n===v?'active':''}" data-count="${v}">${v}人</button>`).join('');let fields=Array.from({length:state.n},(_,i)=>`<label class="field">プレイヤー${i+1}の名前 <input class="txt" data-player-name="${i}" maxlength="16" placeholder="プレイヤー${i+1}" value="${esc(state.names[i])}" autocomplete="off"></label>`).join('');return `
<section class="hero"><div class="hero-copy"><div class="eyebrow">TACTICS JANKEN</div><h1>数字を配置して、<br><span>じゃんけんで勝負！</span></h1><p>9枚の数字で、グー・チョキ・パーの攻撃力と防御力をつくろう。<br class="hero-desktop-break">3つの手を使い切り、最後まで生き残れ！</p></div><div class="hero-visual" aria-hidden="true"><div class="hero-mini-hands"><span>✊</span><span>✌️</span><span>✋</span></div><div class="hero-mini-grid">${[8,2,5,4,9,1,7,3,6].map(n=>`<span>${n}</span>`).join('')}</div><div class="hero-mini-caption">数字の配置 × 読み合い</div></div></section>
<section class="panel section"><div class="section-title"><span class="dot"></span><h2 style="margin:0">対戦をはじめる</h2></div><div class="grid2"><div class="stack"><div><div class="label" style="margin-bottom:9px">対戦人数</div><div class="pill-row">${nOpts}</div></div><div><div class="label" style="margin-bottom:9px">各手の初期HP</div><div class="pill-row">${hpOpts}</div><p class="note" style="margin:7px 0 0">100はクイック対戦、200は標準、300・400は長期戦におすすめ。</p></div><div class="callout">🔒 手札・配置・じゃんけんの選択は、本人だけが確認する方式です。プレイヤー交代のたびに画面を隠します。</div></div><div class="stack"><div><div class="label" style="margin-bottom:9px">プレイヤー名</div><div class="name-grid">${fields}</div></div><button class="btn gold large wide" data-action="start">⚔ ${state.n}人で対戦スタート</button><button class="btn primary wide" data-action="tutorial">📘 はじめての方へ：チュートリアル</button><div class="note">CPUとの一人用対戦は、対人戦のルール確定後に追加します。</div></div></div></section>
<section class="section"><div class="section-title"><span class="dot"></span><h2 style="margin:0">画像でわかる基本ルール</h2></div><div class="rulegrid"><article class="rule-card"><div class="rule-art">${svgBoard()}</div><div class="rule-body"><h3>① 9枚を並べる</h3><p>縦3枚の掛け算が攻撃力、横3枚の掛け算が防御力。毎ラウンド配り直して配置します。</p></div></article><article class="rule-card"><div class="rule-art">${svgRps()}</div><div class="rule-body"><h3>② 3つの手で勝負</h3><p>グー・チョキ・パーを1回ずつ出します。負けはダメージ、あいこは双方ダメージ。HPは引き継がれます。</p></div></article><article class="rule-card"><div class="rule-art">${svgPass()}</div><div class="rule-body"><h3>③ 1人ずつ配置と選択</h3><p>配置したらそのまま第1戦の手を選択し、終わってから次の人に渡します。全員の選択が終わると大きな「ポン！」ボタンで一斉公開します。</p></div></article></div></section>
<section class="panel section"><h2>特殊バトル（全6種類）</h2><p class="note">毎ラウンド、同じ特殊ルールが全プレイヤーに適用されます。配置を考える前に発表されます。</p><div class="grid3">${RULES.map(r=>`<div class="player-card"><strong style="color:#f7d6a0">${r.name}</strong><p class="note" style="margin:7px 0 0">${r.desc}</p></div>`).join('')}</div><p class="note" style="margin:14px 0 0">0は偶数。防御半減は小数点以下切り捨て。全ての攻撃のうち、受けるダメージは最大の1撃だけです。</p></section>`;}
function pStatus(){return '';}
function hpBars(p){return `<div class="player-hps">${HANDS.map((h,i)=>{let hp=p.hp[i],pc=Math.max(0,hp/state.hpMax*100);return `<div class="hpbox ${hp===0?'dead':hp/state.hpMax<=.3?'low':''}"><div class="hp-top"><span>${h.emoji} ${h.label}</span><b>${hp}/${state.hpMax}</b></div><div class="hp-track"><div class="hp-fill" style="width:${pc}%"></div></div></div>`;}).join('')}</div>`;}
function boardHtml(board,opts={}){let s=stat(board,opts.rule||state.rule);let actionable=opts.interactive||false;return `<div class="boardbox"><div class="battleboard"><div></div>${HANDS.map(h=>`<div class="boardlabel atk">${h.emoji}<br>攻撃↓</div>`).join('')}${board.map((n,i)=>{let lbl=i%3===0?`<div class="boardlabel def">${HANDS[Math.floor(i/3)].emoji}<br>防御→</div>`:'';let selected=opts.selected===i?' selected':'';let redraw=opts.drawSelected?.includes(i)?' redraw':'';let css=`${n%2===0?'even':''}${n===0?' zero':''}${selected}${redraw}`;return lbl+`<button ${actionable?'': 'disabled'} class="cell ${actionable?'clickable':''} ${css}" data-slot="${i}" aria-label="${Math.floor(i/3)+1}行${i%3+1}列 ${n}${opts.drawSelected?.includes(i)?'交換指定':''}">${n}<span class="corner">${n===0?'✦':n%2===0?'偶':'奇'}</span></button>`;}).join('')}</div><div class="line"></div><div class="statgrid">${HANDS.map((h,i)=>`<div class="stat"><div class="hand">${h.emoji}</div><strong>${h.label}</strong><div class="pair"><span>攻 ${s.atk[i]}</span><span>防 ${s.def[i]}</span></div></div>`).join('')}</div></div>`;}
function handoffTo(id,stage){state.currentId=id;state.nextStage=stage;state.screen='handoff';state.selection=null;state.handSelection=null;state.selectedDraw=[];state.mode='move';render();}
function readyTo(id,stage){state.currentId=id;state.nextStage=stage;state.screen='ready';state.selection=null;state.handSelection=null;state.selectedDraw=[];state.mode='move';render();}
function handoff(){let p=player(state.currentId);return `<section class="private"><div class="symbol">🔒</div><div class="eyebrow">画面は非公開です</div><h1> ${esc(p.name)}さんに<br>PCを渡してください</h1><p>前のプレイヤーの情報は隠れています。<br><strong>${esc(p.name)}さん本人が</strong>、PCを受け取ってから下のボタンを押してください。</p><button class="btn gold large wide" data-action="handoff-done">${esc(p.name)}です。PCを受け取りました</button></section>`;}
function ready(){let p=player(state.currentId);return `<section class="private"><span class="secure">🔐 のぞき見防止</span><div class="symbol">${state.nextStage==='setup'?'🃏':'✊'}</div><h1>${esc(p.name)}さん、<br>始めましょう！</h1><p>まわりにほかのプレイヤーがいないか確認してください。<br>この先は<strong>${esc(p.name)}さんだけの秘密の画面</strong>です。</p><div class="callout" style="text-align:left;margin:20px 0">${state.nextStage==='setup'?'数字9枚を交換・配置し、続けて第1戦のじゃんけんの手も選びます。':'これから自分のじゃんけんの手を選びます。'}</div><button class="btn gold large wide" data-action="ready-done">周囲を確認しました。画面を開く</button></section>`;}
function setup(){let p=player(state.currentId),limit=alivePlayers().length===4?1:2,remaining=limit-p.redrawUsed;return `${pStatus()}<div class="panel"><div class="section-title"><span class="dot"></span><h2 style="margin:0">${esc(p.name)}さんの魔法陣</h2></div><div class="callout battle-rule-banner"><span class="battle-rule-name">${state.rule.name}</span><span class="battle-rule-description">${state.rule.desc}</span></div><div style="margin-top:14px">${hpBars(p)}</div><div class="grid2" style="margin-top:18px"><div><h3>数字9枚の配置</h3>${boardHtml(p.board,{interactive:true,selected:state.selection,drawSelected:state.selectedDraw})}</div><div class="stack"><div class="tutorial-box"><h3>① 配置を考えよう</h3><p class="note">「配置を入れ替える」を選び、マスを2つ順にクリックすると数字が入れ替わります。3つの手すべての攻撃・防御を考えて配置しましょう。</p><div class="pill-row"><button class="pill ${state.mode==='move'?'active':''}" data-action="mode-move">配置を入れ替える</button><button class="pill ${state.mode==='draw'?'active':''}" data-action="mode-draw" ${remaining<=0?'disabled':''}>カードを引き直す</button></div></div><div class="tutorial-box"><h3>② カードを交換する（任意）</h3><p class="note">残り交換枚数：<strong>${remaining}枚</strong>／${limit}枚（山札残り${state.drawPile.length}枚）。引き直しモードで交換したいマスを選びます。</p>${state.mode==='draw'?`<p>選択中：${state.selectedDraw.length}枚</p><button class="btn primary wide" data-action="redraw" ${state.selectedDraw.length===0?'disabled':''}>選んだ${state.selectedDraw.length}枚を交換</button>`:`<p class="note">交換しなくても構いません。小さい数字が特殊ルールで有利になることもあります。</p>`}</div><div class="tutorial-box"><h3>③ 魔法陣を確定して手を選ぶ</h3><p class="note">自分の攻撃力・防御力を確認して確定すると、そのまま第1戦のじゃんけん選択画面に進みます。まだPCは渡さないでください。</p><button class="btn gold large wide" data-action="setup-done">魔法陣を確定して第1戦の手を選ぶ →</button></div></div></div></div>`;}
function choose(){let p=player(state.currentId),s=stat(p.board,state.rule);return `${pStatus()}<div class="panel"><h2>${esc(p.name)}さん、第${state.clash}戦の手を選んでください</h2><div class="callout">残っている手から1つ選びます。このラウンドでは、同じ手を2回出せません。選んで確定すると画面が隠れます。第1戦では配置と手の選択を続けて行い、その後でPCを渡します。</div><div style="margin:15px 0">${hpBars(p)}</div><div class="rpschoice">${HANDS.map((h,i)=>{let dead=p.hp[i]<=0,used=p.used.includes(i),sel=state.handSelection===i;return `<button class="handbtn ${sel?'selected':''}" data-pick="${i}" ${dead||used?'disabled':''}><span class="emoji">${h.emoji}</span><strong>${h.label}</strong><span class="nums">攻 ${s.atk[i]} / 防 ${s.def[i]}</span><span class="nums">${dead?'HP0・使用不可':used?'このラウンド使用済み':sel?'選択中':'選択できます'}</span></button>`}).join('')}</div><div style="margin-top:18px"><button class="btn gold large wide" data-action="choose-done" ${state.handSelection===null?'disabled':''}>この手で決定して画面を隠す 🔒</button>${state.firstClashPending?`<button class="btn soft wide" style="margin-top:10px" data-action="back-to-setup">← 魔法陣の配置に戻る</button>`:''}</div><details style="margin-top:17px"><summary style="cursor:pointer;color:#b5cafa">自分の魔法陣を確認</summary><div style="max-width:560px;margin:12px auto">${boardHtml(p.board)}</div></details></div>`;}
function jankenScreen(){return `${pStatus()}<section class="janken-stage" aria-label="全員の選択完了・じゃんけん開始"><div class="janken-round">全員の手が決まりました · 第${state.clash}戦</div><h1 class="janken-heading">じゃんけん！</h1><p class="janken-note">みんなが画面を見られる状態になったら、<br>大きなボタンを押して一斉公開しましょう！</p><button class="pon-button" type="button" data-action="pon" autofocus>ポン！</button><p class="note" style="margin-top:27px">※「ポン！」を押すまでは、誰の手も表示しません。</p></section>`;}
function showJanken(){if(state.screen!=='choose')return;state.handSelection=null;state.screen='janken';render();}
function computeBattle(){let a=state.choiceIds.map(id=>player(id)).filter(Boolean);let entries=a.map(p=>({id:p.id,name:p.name,hand:p.choice,attack:stat(p.board,state.rule).atk[p.choice],defense:stat(p.board,state.rule).def[p.choice],before:p.hp[p.choice]}));let out=[];for(let d of entries){let attacks=[];for(let s of entries){if(s.id===d.id)continue;let tie=s.hand===d.hand;let wins=(s.hand===0&&d.hand===1)||(s.hand===1&&d.hand===2)||(s.hand===2&&d.hand===0);if(tie||wins){let dmg=Math.max(0,s.attack-d.defense);attacks.push({from:s.name,damage:dmg,hand:s.hand});}}let best=attacks.sort((a,b)=>b.damage-a.damage)[0]||null;let damage=best?best.damage:0;out.push({...d,attacks,damage,source:best?best.from:null,remaining:Math.max(0,d.before-damage)});}
 for(let x of out){let p=player(x.id);p.hp[x.hand]=x.remaining;p.used.push(x.hand);p.choice=null;p.totalDamage=(p.totalDamage||0)+x.damage;}
 state.result=out;state.screen='result';render();}
function outcomeFor(r,all){let wins=0,losses=0,ties=0;for(let other of all){if(other.id===r.id)continue;if(other.hand===r.hand)ties++;else if((r.hand+1)%3===other.hand)wins++;else losses++;}if(wins&&losses)return {label:'勝ち・負け',kind:'mixed',description:'勝ち負け両方の相手がいます'};if(wins)return {label:ties?'勝ち・あいこ':'勝ち！',kind:'win',description:ties?'勝利とあいこがあります':'じゃんけん勝利！'};if(losses)return {label:ties?'負け・あいこ':'負け',kind:'lose',description:ties?'敗北とあいこがあります':'じゃんけん敗北'};return {label:'あいこ！',kind:'draw',description:'同じ手で引き分け'};}
function resultScreen(){let remaining=alivePlayers().length;
 let outcomeLabels=state.result.map(r=>outcomeFor(r,state.result));
 let headline=state.result.length===2?(state.result[0].hand===state.result[1].hand?'あいこ！':`${esc(state.result[outcomeLabels.findIndex(o=>o.kind==='win')].name)}さんの勝ち！`):'全員の手を公開！';
 let revelation=state.result.map((r,i)=>{let o=outcomeLabels[i];return `<div class="reveal-player ${o.kind}"><div class="reveal-player-name">${esc(r.name)}さん</div><div class="reveal-hand" aria-label="${HANDS[r.hand].label}">${HANDS[r.hand].emoji}</div><div class="reveal-hand-label">${HANDS[r.hand].label}</div><div class="reveal-outcome">${o.label}</div><div class="reveal-damage">被ダメージ <strong>${r.damage}</strong></div><div class="reveal-hp">HP ${r.before} → <strong>${r.remaining}</strong>${r.remaining===0?' 💀':''}</div></div>`;}).join('');
 let battleDetails=state.result.map(r=>`<div class="logitem"><strong>${esc(r.name)}さん（${HANDS[r.hand].emoji}）</strong><div class="note">防御力 ${r.defense} / HP ${r.before} → ${r.remaining}</div>${r.attacks.length?r.attacks.map(a=>{let source=state.result.find(x=>x.name===a.from);return `<div class="attack-math">${esc(a.from)}さんの攻撃 ${source?source.attack:'?'} − ${esc(r.name)}さんの防御 ${r.defense} → <strong>${a.damage} ダメージ</strong></div>`;}).join(''):'<div class="attack-math">この勝負では攻撃を受けません</div>'}<div class="attack-final">採用ダメージ：<strong>${r.damage}</strong>（最大の1撃のみ）</div></div>`).join('');
 return `<section class="panel result-panel"><div class="reveal-hero"><div class="reveal-kicker">第${state.round}ラウンド · 第${state.clash}戦</div><h1 class="reveal-heading">じゃんけんの結果！</h1><div class="reveal-headline">${headline}</div></div><div class="reveal-grid count-${state.result.length}">${revelation}</div><p class="note center result-note">攻撃とHPの変化は同時に計算しています。複数の相手から攻撃された場合は最大の1撃だけ受けます。</p><details class="result-details"><summary>魔法陣・攻撃の内訳を見る <span class="detail-chevron" aria-hidden="true">⌄</span></summary><div class="detail-content"><h3>全員の魔法陣</h3><div class="grid2">${state.players.map(p=>`<div><h3>${esc(p.name)}さんの配置</h3>${boardHtml(p.board)}</div>`).join('')}</div><h3 style="margin-top:23px">攻撃の計算内訳</h3><div class="battle-log">${battleDetails}</div></div></details><h3 style="margin-top:24px">現在のHP</h3><div class="grid2">${state.players.map(p=>`<div class="player-card ${p.hp.every(h=>h<=0)?'dead':''}"><div class="playername">${esc(p.name)} ${p.hp.every(h=>h<=0)?'（脱落）':''}</div>${hpBars(p)}</div>`).join('')}</div><div class="callout" style="margin-top:18px">${remaining===0?'全員の手が同時に尽きました。引き分けです。':remaining===1?`${esc(alivePlayers()[0].name)}さんが最後まで生き残りました！`:`生存${remaining}人。HP0の手は次の勝負以降、出せません。`}</div><button class="btn gold large wide" style="margin-top:16px" data-action="result-next">${remaining<=1?'最終結果を見る':hasNextClash()?'次のじゃんけんへ':'次のラウンドへ（再配布）'}</button></section>`;}
function hasNextClash(){return state.clash<state.clashCap && alivePlayers().every(p=>unused(p).length>0);}
function gameover(){let survivors=alivePlayers();let winner=survivors.length===1?survivors[0]:null;return `<section class="private"><div class="symbol">${winner?'🏆':'🤝'}</div><div class="eyebrow">対戦終了</div><h1>${winner?`${esc(winner.name)}さんの勝利！`:'引き分け！'}</h1><p>${state.round}ラウンドの激戦、おつかれさまでした。</p><div class="grid2" style="text-align:left;margin:23px 0">${state.players.map(p=>`<div class="player-card"><strong>${esc(p.name)}</strong><div class="note">残りHP合計：${p.hp.reduce((s,h)=>s+h,0)}</div>${hpBars(p)}</div>`).join('')}</div><button class="btn gold large wide" data-action="home">トップページへ戻る</button></section>`;}
function tutorial(){let step=state.tutorialStep;const titles=['勝負の目的','数字の配置を体験','3つの手を使う','じゃんけんとHP','特殊バトルとカード交換','秘密の画面で交代'];let body='';if(step===0)body=`<p>2〜4人で勝負する数字カードのじゃんけんゲームです。配られた9枚を並べて、3つの手を強くします。相手のグー・チョキ・パーをすべてHP0にすれば勝ちです。</p><div class="rule-art" style="border-radius:15px;max-width:570px;margin:auto">${svgRps()}</div>`;
 if(step===1){let stats=stat(state.tutorialBoard,{id:'normal'});body=`<p>数字を2枚クリックして場所を交換してみましょう。<strong>縦3枚の積が攻撃力、横3枚の積が防御力</strong>になります。配置を変えると3つの手の強さが変わります。</p><div class="challenge">チャレンジ：グーの攻撃力を、現在の <b>${stats.atk[0]}</b> より大きくしてみよう！</div><div class="tutorial-demo">${boardHtml(state.tutorialBoard,{interactive:true,selected:state.tutorialSelection,rule:{id:'normal'}})}</div>`;}
 if(step===2)body=`<p>数字の配置が終わったら、その配置を変えずにグー・チョキ・パーを<strong>各1回ずつ</strong>使います。どの手を先に出すかは、毎回ほかのプレイヤーの残りHPを見て判断できます。HP0の手は使用できず、ラウンドの勝負数は生存手が最も少ない人に合わせます。</p><div class="grid3">${HANDS.map((h,i)=>`<div class="stat"><div style="font-size:2.6rem">${h.emoji}</div><strong>第${i+1}戦（例）</strong><span class="note">使った手は、そのラウンドでは再使用できません</span></div>`).join('')}</div>`;
 if(step===3)body=`<p>勝った人が負けた人に攻撃します。<strong>あいこは双方が攻撃</strong>します。</p><div class="tutorial-box"><div class="flex" style="justify-content:space-around"><span style="font-size:3rem">✊</span><strong>VS</strong><span style="font-size:3rem">✌️</span></div><p class="center">グーの攻撃力180、チョキの防御力65なら</p><div class="center" style="font-size:1.55rem;color:var(--gold);font-weight:900">180 − 65 = 115 ダメージ</div><p class="center note">HP200なら、チョキの残りHPは85。次ラウンドへ引き継ぎます。</p></div><p>4人戦で複数の攻撃を受けても、被ダメージは<strong>最も大きい1撃だけ</strong>を採用します。</p>`;
 if(step===4)body=`<p>毎ラウンド、対戦ルールが変わります。数字が偶数・奇数か、0があるかで有利な配置が変化します。</p><div class="grid2">${RULES.map(r=>`<div class="player-card"><strong>${r.name}</strong><div class="note">${r.desc}</div></div>`).join('')}</div><p style="margin-top:13px">また、配られた9枚のうち<strong>2〜3人戦は2枚まで、4人戦は1枚まで</strong>引き直せます。</p>`;
 if(step===5)body=`<p>同じPCで遊ぶため、<strong>手札・配置・選んだ手はほかの人に見せません</strong>。最初の勝負では数字の配置と手の選択を続けて行います。選択を確定した後、次の人の名前が大きく表示される「受け渡し画面」に切り替わります。全員が選び終えると「じゃんけん！」画面になり、大きな「ポン！」ボタンで結果を公開します。</p><div class="rule-art" style="border-radius:15px;max-width:540px;margin:auto">${svgPass()}</div><div class="callout" style="margin-top:14px">数字配置 → 第1戦の手を選択 → PCを渡す、という順番です。受け渡し時は「本人の受け取り確認」→「周囲を確認して開始」の2段階で進みます。</div>`;
 return `<section class="panel"><div class="flex" style="justify-content:space-between"><div><div class="eyebrow">TUTORIAL</div><h2 style="margin:7px 0">チュートリアル</h2></div><button class="btn soft" data-action="home">トップへ戻る</button></div><div class="stepper">${titles.map((t,i)=>`<div class="step ${i===step?'current':i<step?'done':''}"><i>${i+1}</i>${i===step?esc(t):''}</div>`).join('')}</div><div class="tutorial-box"><h3>${step+1}. ${titles[step]}</h3>${body}</div><div class="flex" style="justify-content:space-between;margin-top:20px"><button class="btn" data-action="tutorial-prev" ${step===0?'disabled':''}>← 前へ</button><button class="btn gold" data-action="tutorial-next">${step===titles.length-1?'チュートリアル完了・トップへ':'次へ →'}</button></div></section>`;}
function startMatch(){let raw=Array.from(document.querySelectorAll('[data-player-name]'));raw.forEach(x=>state.names[Number(x.dataset.playerName)]=x.value.trim());state.players=Array.from({length:state.n},(_,i)=>({id:i,name:state.names[i]||`プレイヤー${i+1}`,hp:[state.hpMax,state.hpMax,state.hpMax],board:[],used:[],redrawUsed:0,choice:null,totalDamage:0}));state.round=0;startRound(true);}
function startRound(first=false){state.round++;state.rule=RULES[Math.floor(R()*RULES.length)];state.drawPile=makeDeck();let live=alivePlayers();for(let p of live){p.board=state.drawPile.splice(0,9);p.used=[];p.redrawUsed=0;p.choice=null;}state.setupIds=live.map(p=>p.id);state.setupIndex=0;state.firstClashPending=true;state.clash=0;state.clashCap=Math.min(...live.map(p=>p.hp.filter(h=>h>0).length));state.result=null;readyTo(state.setupIds[0],'setup');}
function setupDone(){if(state.screen!=='setup')return;state.clash=1;state.choiceIds=state.setupIds.slice();state.choiceIndex=state.setupIndex;state.handSelection=null;state.selection=null;state.selectedDraw=[];state.screen='choose';render();}
function beginClash(){let active=alivePlayers();if(active.length<=1){state.screen='gameover';render();return;}state.choiceIds=active.filter(p=>unused(p).length>0).map(p=>p.id);if(state.choiceIds.length!==active.length){startRound();return;}state.choiceIndex=0;handoffTo(state.choiceIds[0],'choose');}
function choiceDone(){if(state.screen!=='choose')return;let p=player(state.currentId);if(state.handSelection===null||p.hp[state.handSelection]===0||p.used.includes(state.handSelection))return;p.choice=state.handSelection;state.handSelection=null;if(state.firstClashPending){if(state.setupIndex<state.setupIds.length-1){state.setupIndex++;handoffTo(state.setupIds[state.setupIndex],'setup');}else{state.firstClashPending=false;showJanken();}}else if(state.choiceIndex<state.choiceIds.length-1){state.choiceIndex++;handoffTo(state.choiceIds[state.choiceIndex],'choose');}else showJanken();}
function afterResult(){if(alivePlayers().length<=1){state.screen='gameover';render();return;}if(hasNextClash()){state.clash++;beginClash();}else startRound();}
function changeCell(i){let b=state.screen==='setup'?player(state.currentId).board:state.tutorialBoard;if(state.screen==='tutorial'){if(state.tutorialSelection===null){state.tutorialSelection=i;}else{[b[i],b[state.tutorialSelection]]=[b[state.tutorialSelection],b[i]];state.tutorialSelection=null;}render();return;}
 let p=player(state.currentId);if(state.mode==='draw'){let idx=state.selectedDraw.indexOf(i),limit=(alivePlayers().length===4?1:2)-p.redrawUsed;if(idx>=0)state.selectedDraw.splice(idx,1);else if(state.selectedDraw.length<limit)state.selectedDraw.push(i);}else{if(state.selection===null)state.selection=i;else{[b[i],b[state.selection]]=[b[state.selection],b[i]];state.selection=null;}}render();}
function redrawCards(){let p=player(state.currentId),limit=alivePlayers().length===4?1:2;if(p.redrawUsed+state.selectedDraw.length>limit||state.selectedDraw.length>state.drawPile.length)return;for(let i of state.selectedDraw){p.board[i]=state.drawPile.shift();p.redrawUsed++;}state.selectedDraw=[];if(p.redrawUsed===limit)state.mode='move';render();}
app.addEventListener('input',ev=>{if(ev.target.matches('[data-player-name]'))state.names[Number(ev.target.dataset.playerName)]=ev.target.value;});
app.addEventListener('click',ev=>{const hit=ev.target.closest('button');if(!hit||hit.disabled)return;
 if(hit.dataset.hp){state.hpMax=Number(hit.dataset.hp);render();return;}
 if(hit.dataset.count){state.n=Number(hit.dataset.count);render();return;}
 if(hit.dataset.slot!==undefined){if(state.screen==='setup'||state.screen==='tutorial'&&state.tutorialStep===1)changeCell(Number(hit.dataset.slot));return;}
 if(hit.dataset.pick!==undefined){state.handSelection=Number(hit.dataset.pick);render();return;}
 let action=hit.dataset.action;if(!action)return;
 if(action==='start')startMatch();
 else if(action==='home'){state.screen='home';render();}
 else if(action==='tutorial'){state.tutorialStep=0;state.tutorialBoard=[9,2,3,4,5,6,7,8,1];state.tutorialSelection=null;state.screen='tutorial';render();}
 else if(action==='tutorial-prev'){state.tutorialStep=Math.max(0,state.tutorialStep-1);render();}
 else if(action==='tutorial-next'){if(state.tutorialStep>=5)state.screen='home';else state.tutorialStep++;render();}
 else if(action==='handoff-done'){state.screen='ready';render();}
 else if(action==='ready-done'){state.screen=state.nextStage;render();}
 else if(action==='mode-move'){state.mode='move';state.selection=null;state.selectedDraw=[];render();}
 else if(action==='mode-draw'){state.mode='draw';state.selection=null;state.selectedDraw=[];render();}
 else if(action==='redraw')redrawCards();
 else if(action==='setup-done')setupDone();
 else if(action==='back-to-setup'&&state.screen==='choose'&&state.firstClashPending){state.handSelection=null;state.screen='setup';render();}
 else if(action==='choose-done')choiceDone();
 else if(action==='pon'&&state.screen==='janken')computeBattle();
 else if(action==='result-next')afterResult();
});
render();
</script>
</body>
</html>
